# Render blueprint: FastAPI backend + PostgreSQL. The frontend is deployed separately
# (Vercel or Netlify) with VITE_API_URL pointing at this service.
services:
  - type: web
    name: mc3d-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mc3d-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-frontend.vercel.app
      - key: STORAGE_DIR
        value: /data/storage
      - key: WORKER_THREADS
        value: "1"
    # Uploaded frames and results live on disk. Without a persistent disk they are lost on
    # every deploy/restart (the database rows survive). Disks require a paid instance type.
    disk:
      name: mc3d-data
      mountPath: /data
      sizeGB: 5

databases:
  - name: mc3d-db
    plan: free
